<title>Blotter Trading Journal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one world per skin. A live candlestick chart runs behind everything; content floats on glass panels.
   Hero with rotating mantra + balance card, then the month grid with KW column. Six skins, picked by the customer on first run. */
:root, [data-skin="navy"]{
  --bg:#060F27; --bg-rgb:6,15,39; --bg-2:#0A1838;
  --panel-rgb:9,22,54; --panel-hi-rgb:13,30,70; --modal:#0B1B42; --modal-2:#0E2252;
  --fg-rgb:255,255,255; --ink:#FFFFFF; --ink-2:#E4EAF5; --muted:#A6B4CF; --faint:#6F80A6;
  --gold:#D9B450; --gold-hi:#F6E2A0; --gold-lo:#A57D22; --acc-a:#F7E5A6; --acc-c:#B3852A;
  --acc-rgb:217,180,80; --acc-hi-rgb:246,226,160; --acc-text:#F6E2A0; --on-gold:#081634;
  --glow2-rgb:38,86,196; --silver:#F2F5FB; --silver-rgb:242,245,251;
  --up:#43D896; --up-rgb:67,216,150; --down:#FF7377; --down-rgb:255,115,119; --be:#AEB9CE; --be-rgb:174,185,206;
  --sh:1; --is-light:0; --scrim:rgba(2,7,20,.7);
  color-scheme:dark;
}
[data-skin="onyx"]{
  --bg:#0A0B0E; --bg-rgb:10,11,14; --bg-2:#121318;
  --panel-rgb:20,21,26; --panel-hi-rgb:28,30,36; --modal:#15161B; --modal-2:#1B1D23;
  --fg-rgb:255,255,255; --ink:#FFFFFF; --ink-2:#E6E8EC; --muted:#A0A5B0; --faint:#6A6F7A;
  --gold:#C9CED8; --gold-hi:#F5F7FA; --gold-lo:#878E9B; --acc-a:#FFFFFF; --acc-c:#8A919E;
  --acc-rgb:201,206,216; --acc-hi-rgb:245,247,250; --acc-text:#F5F7FA; --on-gold:#0A0B0E;
  --glow2-rgb:70,80,100; --silver:#8FB0E8; --silver-rgb:143,176,232;
  --up:#43D896; --up-rgb:67,216,150; --down:#FF7377; --down-rgb:255,115,119; --be:#AEB9CE; --be-rgb:174,185,206;
  --sh:1; --is-light:0; --scrim:rgba(0,0,0,.7);
  color-scheme:dark;
}
[data-skin="ocean"]{
  --bg:#03141B; --bg-rgb:3,20,27; --bg-2:#062029;
  --panel-rgb:6,30,40; --panel-hi-rgb:9,40,52; --modal:#06232E; --modal-2:#092C39;
  --fg-rgb:255,255,255; --ink:#FFFFFF; --ink-2:#DCEFF3; --muted:#94B9C2; --faint:#5A808A;
  --gold:#4CC3FF; --gold-hi:#B8E8FF; --gold-lo:#1A82BF; --acc-a:#C6EEFF; --acc-c:#1878B3;
  --acc-rgb:76,195,255; --acc-hi-rgb:184,232,255; --acc-text:#B8E8FF; --on-gold:#02161E;
  --glow2-rgb:20,120,140; --silver:#F1F7F9; --silver-rgb:241,247,249;
  --up:#43D896; --up-rgb:67,216,150; --down:#FF7377; --down-rgb:255,115,119; --be:#AEB9CE; --be-rgb:174,185,206;
  --sh:1; --is-light:0; --scrim:rgba(1,10,14,.7);
  color-scheme:dark;
}
[data-skin="royal"]{
  --bg:#0F0A1F; --bg-rgb:15,10,31; --bg-2:#170F2E;
  --panel-rgb:26,17,50; --panel-hi-rgb:35,24,64; --modal:#1B1235; --modal-2:#231842;
  --fg-rgb:255,255,255; --ink:#FFFFFF; --ink-2:#ECE6F8; --muted:#B3A8CE; --faint:#786C98;
  --gold:#D9B450; --gold-hi:#F6E2A0; --gold-lo:#A57D22; --acc-a:#F7E5A6; --acc-c:#B3852A;
  --acc-rgb:217,180,80; --acc-hi-rgb:246,226,160; --acc-text:#F6E2A0; --on-gold:#160C26;
  --glow2-rgb:130,70,210; --silver:#F4F0FC; --silver-rgb:244,240,252;
  --up:#43D896; --up-rgb:67,216,150; --down:#FF7377; --down-rgb:255,115,119; --be:#B9B0CE; --be-rgb:185,176,206;
  --sh:1; --is-light:0; --scrim:rgba(8,4,18,.7);
  color-scheme:dark;
}
[data-skin="copper"]{
  --bg:#0E0D0C; --bg-rgb:14,13,12; --bg-2:#171513;
  --panel-rgb:25,22,20; --panel-hi-rgb:34,30,27; --modal:#1C1917; --modal-2:#24201D;
  --fg-rgb:255,255,255; --ink:#FFFFFF; --ink-2:#EFE8E2; --muted:#B2A69B; --faint:#786D64;
  --gold:#E0895A; --gold-hi:#F8C7A8; --gold-lo:#A55730; --acc-a:#FCD6BE; --acc-c:#9E4F29;
  --acc-rgb:224,137,90; --acc-hi-rgb:248,199,168; --acc-text:#F8C7A8; --on-gold:#1A0D06;
  --glow2-rgb:150,70,40; --silver:#F3EEEA; --silver-rgb:243,238,234;
  --up:#43D896; --up-rgb:67,216,150; --down:#FF6B7A; --down-rgb:255,107,122; --be:#B9B0A8; --be-rgb:185,176,168;
  --sh:1; --is-light:0; --scrim:rgba(5,4,3,.72);
  color-scheme:dark;
}
[data-skin="arctic"]{
  --bg:#EEF2F8; --bg-rgb:238,242,248; --bg-2:#E3E9F3;
  --panel-rgb:255,255,255; --panel-hi-rgb:247,249,253; --modal:#FFFFFF; --modal-2:#F2F5FA;
  --fg-rgb:16,32,68; --ink:#0B1630; --ink-2:#26355A; --muted:#5A6886; --faint:#8D99B0;
  --gold:#2B5BE8; --gold-hi:#9DB5FF; --gold-lo:#1B3FB0; --acc-a:#7C9DFF; --acc-c:#1C3FAE;
  --acc-rgb:43,91,232; --acc-hi-rgb:157,181,255; --acc-text:#1F48C9; --on-gold:#FFFFFF;
  --glow2-rgb:120,160,255; --silver:#4A5774; --silver-rgb:74,87,116;
  --up:#0E9F62; --up-rgb:14,159,98; --down:#E0454B; --down-rgb:224,69,75; --be:#7A88A3; --be-rgb:122,136,163;
  --sh:.32; --is-light:1; --scrim:rgba(20,30,55,.4);
  color-scheme:light;
}
:root, [data-skin]{
  --panel:rgba(var(--panel-rgb),.72); --card:rgba(var(--panel-rgb),.86);
  --surface:rgba(var(--fg-rgb),.035); --surface-2:rgba(var(--fg-rgb),.07);
  --line:rgba(var(--fg-rgb),.08); --line-strong:rgba(var(--fg-rgb),.2);
  --gold-soft:rgba(var(--acc-rgb),.13); --gold-line:rgba(var(--acc-rgb),.4);
  --gold-grad:linear-gradient(135deg,var(--acc-a) 0%,var(--gold) 45%,var(--acc-c) 100%);
  --silver-soft:rgba(var(--silver-rgb),.1);
  --be-soft:rgba(var(--be-rgb),.13); --be-line:rgba(var(--be-rgb),.42);
  --up-soft:rgba(var(--up-rgb),.13); --up-line:rgba(var(--up-rgb),.42);
  --down-soft:rgba(var(--down-rgb),.13); --down-line:rgba(var(--down-rgb),.45);
  --header:rgba(var(--bg-rgb),.84);
  --shadow-lg:0 30px 80px rgba(0,0,0,calc(.5 * var(--sh)));
}
/* account colours: the first two follow the skin, the rest are fixed hues that read on every dark skin */
:root, [data-skin]{
  --ac-gold:var(--gold); --ac-silver:var(--silver); --ac-violet:#A98BFF; --ac-coral:#FF9466; --ac-mint:#4FD6C2;
  --ac-rose:#F47CC4; --ac-sky:#4FB8FF; --ac-lemon:#E9DA6A; --ac-blue:#7C93FF; --ac-sand:#D7B99A;
}
[data-skin="arctic"]{
  --ac-violet:#6D4AE0; --ac-coral:#D9622E; --ac-mint:#0F9C88; --ac-rose:#C93C8F;
  --ac-sky:#0B84D0; --ac-lemon:#9C8A12; --ac-blue:#3F56D6; --ac-sand:#8E6A48;
}
:root{
  --lb-bg:rgba(3,7,18,.95); --lb-fg:#F2F4F7;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
body{background:radial-gradient(1100px 620px at 88% -8%,rgba(var(--acc-rgb),.14),transparent 62%),radial-gradient(900px 700px at -12% 105%,rgba(var(--glow2-rgb),.22),transparent 60%),var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:35;background:var(--bg)}
html{scrollbar-color:rgba(var(--acc-rgb),.35) transparent;scrollbar-width:thin}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(var(--acc-rgb),.28);border-radius:999px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:rgba(var(--acc-rgb),.5);background-clip:padding-box;border:3px solid transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
::selection{background:var(--gold);color:var(--on-gold)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.spacer{flex:1 1 auto}
.gold-t{background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}

#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:block}
.progress{position:fixed;top:0;left:0;right:0;height:2px;z-index:40;background:var(--gold-grad);transform-origin:0 50%;transform:scaleX(0);box-shadow:0 0 12px rgba(var(--acc-rgb),.7)}

/* Header */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;border-bottom:1px solid transparent;transition:background .35s,border-color .35s}
.topbar.scrolled{background:var(--header);border-bottom-color:var(--gold-line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.topbar-in{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 22px;transition:padding .35s var(--ease)}
.topbar.scrolled .topbar-in{padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;text-decoration:none;color:inherit}
.brand svg{flex:none;filter:drop-shadow(0 0 8px rgba(var(--acc-rgb),.45))}
.mark{font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:21px;letter-spacing:.04em;text-transform:uppercase;line-height:1}
.brand .sub{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);opacity:.85}
.tabs{display:flex;gap:2px;padding:4px;background:rgba(var(--fg-rgb),.05);border:1px solid var(--line);border-radius:999px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.tabs a{padding:7px 18px;border-radius:999px;color:var(--muted);text-decoration:none;font-weight:500;font-size:14px;white-space:nowrap;transition:color .2s,background .2s}
.tabs a:hover{color:var(--ink)}
.tabs{position:relative}
.tabs a{position:relative;z-index:1;transition:color .3s}
.tabs a[aria-current="page"]{color:var(--on-gold);font-weight:600}
.tab-ind{position:absolute;top:4px;bottom:4px;left:0;width:0;border-radius:999px;background:var(--gold-grad);box-shadow:0 4px 18px rgba(var(--acc-rgb),.35),inset 0 1px 0 rgba(255,255,255,.45);opacity:0;pointer-events:none}
.tab-ind.ready{transition:transform .5s cubic-bezier(.45,1.45,.45,1),width .5s cubic-bezier(.45,1.45,.45,1)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.status{display:inline-flex;align-items:center;gap:7px;font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.status i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.status.ok i{background:var(--up);box-shadow:0 0 8px var(--up)}
.status.local i{background:var(--gold)}
.status.err i{background:var(--down)}
.cur select{height:32px;padding:0 8px;border:1px solid var(--line-strong);border-radius:8px;background:var(--bg-2);font-family:var(--f-mono);font-size:13px}

.shell{position:relative;z-index:1;max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:4px 96px}
.banner{margin-bottom:16px;padding:11px 15px;border-radius:12px;background:var(--gold-soft);border:1px solid var(--gold-line);font-size:14px;max-width:920px;color:var(--ink-2)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 16px;border-radius:10px;border:1px solid var(--line-strong);background:rgba(var(--fg-rgb),.03);font-weight:500;font-size:14px;white-space:nowrap;text-decoration:none;transition:border-color .18s,background .18s,transform .18s,box-shadow .18s,filter .18s}
.btn:hover{border-color:var(--gold-line);background:rgba(var(--fg-rgb),.06)}
.btn.primary{background:var(--gold-grad);border-color:transparent;color:var(--on-gold);font-weight:600;box-shadow:0 6px 22px rgba(var(--acc-rgb),.28)}
.btn.primary:hover{filter:brightness(1.07);transform:translateY(-1px);box-shadow:0 10px 30px rgba(var(--acc-rgb),.4)}
.btn:active:not(:disabled){transform:translateY(1px) scale(.98);transition-duration:.06s}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.icon{width:38px;padding:0}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
.btn.danger{color:var(--down)}
.btn.danger-solid{background:var(--down);border-color:var(--down);color:var(--on-gold);font-weight:600}
.btn:disabled{opacity:.55;cursor:default;filter:none;transform:none}
.btn svg{flex:none}

/* Segmented */
.seg{display:inline-flex;padding:3px;gap:2px;background:rgba(var(--fg-rgb),.04);border:1px solid var(--line);border-radius:10px}
.seg button{border:0;background:transparent;padding:6px 13px;border-radius:7px;font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap;transition:color .15s,background .15s}
.seg button:hover{color:var(--ink)}
.seg button[aria-checked="true"]{background:var(--gold-soft);color:var(--acc-text);box-shadow:inset 0 0 0 1px var(--gold-line)}
.seg.wide{display:flex;flex-wrap:wrap;width:100%}
.seg.wide button{flex:1 1 auto;padding:8px 10px}
.side-seg button[data-val="long"][aria-checked="true"],.bias-seg button[data-val="bull"][aria-checked="true"],.res-seg button[data-val="hit"][aria-checked="true"]{background:var(--up-soft);color:var(--up);box-shadow:inset 0 0 0 1px var(--up-line)}
.side-seg button[data-val="short"][aria-checked="true"],.bias-seg button[data-val="bear"][aria-checked="true"],.res-seg button[data-val="miss"][aria-checked="true"]{background:var(--down-soft);color:var(--down);box-shadow:inset 0 0 0 1px var(--down-line)}

.seg.oc-seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:0;background:none;border:0}
.seg.oc-seg button{display:flex;flex-direction:column;align-items:center;gap:5px;padding:14px 6px 12px;border-radius:12px;border:1.5px solid var(--line-strong);background:rgba(var(--fg-rgb),.03);color:var(--muted);font-weight:500;transition:border-color .15s,background .15s,box-shadow .2s,color .15s,transform .15s}
.seg.oc-seg button svg{opacity:.8}
.seg.oc-seg button b{font-family:var(--f-mono);font-size:17px;font-weight:700;letter-spacing:.05em;color:var(--ink)}
.seg.oc-seg button small{font-size:11.5px;white-space:nowrap}
.seg.oc-seg button:hover{border-color:var(--gold-line);color:var(--ink)}
.oc-seg button[data-val="tp"][aria-checked="true"]{background:var(--up-soft);border-color:var(--up);color:var(--up);box-shadow:0 0 26px rgba(var(--up-rgb),.22)}
.oc-seg button[data-val="sl"][aria-checked="true"]{background:var(--down-soft);border-color:var(--down);color:var(--down);box-shadow:0 0 26px rgba(var(--down-rgb),.2)}
.oc-seg button[data-val="be"][aria-checked="true"]{background:var(--be-soft);border-color:var(--be);color:var(--ink);box-shadow:0 0 26px rgba(var(--be-rgb),.16)}
.oc-seg button[aria-checked="true"] svg{opacity:1}

.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.eyebrow.gold{color:var(--gold)}

/* Hero */
.hero{position:relative;z-index:0;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:28px 40px;align-items:end;padding-block:30px 34px}
.hero-txt{display:flex;flex-direction:column;gap:14px;min-width:0;will-change:transform,opacity}
.mantra{margin:0;display:grid;font-family:var(--f-display);font-stretch:118%;font-weight:800;text-transform:uppercase;font-size:clamp(30px,5.2vw,64px);line-height:1;letter-spacing:-.005em}
.mantra .m{grid-area:1/1;visibility:hidden;text-wrap:balance}
.mantra .m.on{visibility:visible}
.mantra .wm{display:inline-block;overflow:hidden;vertical-align:top;padding-block:.06em .1em;margin-block:-.06em -.1em}
.mantra .w{display:inline-block}
.mantra .w.g{background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.mantra .m.on .w{animation:wordin .8s var(--ease) backwards;animation-delay:calc(var(--i) * 70ms)}
.mantra .m.leaving .w{animation:wordout .42s ease-in forwards;animation-delay:calc(var(--i) * 25ms)}
@keyframes wordin{from{transform:translateY(105%);opacity:0}to{transform:none;opacity:1}}
@keyframes wordout{to{transform:translateY(-105%);opacity:0}}
.hero-sub{margin:0;color:var(--muted);max-width:52ch;font-size:15px}
.equity{position:relative;background:var(--panel);border:1px solid var(--gold-line);border-radius:20px;padding:18px 20px 16px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 24px 70px rgba(0,0,0,calc(.4 * var(--sh))),inset 0 1px 0 rgba(var(--fg-rgb),.06);min-width:0;will-change:transform}
.eq-head{display:flex;align-items:center;gap:10px;justify-content:space-between}
.eq-n{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.eq-row{display:flex;align-items:flex-end;flex-wrap:wrap;gap:6px 14px;margin-top:8px}
.eq-v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600;font-size:clamp(40px,4.6vw,58px);line-height:1}
.eq-vl{display:flex;flex-direction:column;font-size:14px;font-weight:600;color:var(--ink);padding-bottom:4px}
.eq-vl small{font-family:var(--f-mono);font-size:11px;font-weight:400;color:var(--muted)}
.ratio{display:flex;gap:2px;height:10px;border-radius:999px;overflow:hidden;background:rgba(var(--fg-rgb),.07);margin-top:16px}
.ratio .r{display:block;width:0;transition:width 1.1s var(--ease)}
.r.tp{background:var(--up)} .r.be{background:var(--be)} .r.sl{background:var(--down)}
.ratio-l{margin-top:9px;font-family:var(--f-mono);font-size:12.5px;color:var(--ink-2);min-height:19px}
.cnts{display:inline-flex;flex-wrap:wrap;gap:3px 12px}
.cnt{display:inline-flex;align-items:center;white-space:nowrap}
.sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;flex:none}
.sw.tp{background:var(--up)} .sw.sl{background:var(--down)} .sw.be{background:var(--be)}
.ratio-l b,.wk-l b,.weeks .wrow .p b{font-weight:700}
.tape-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:16px}
.tape-hint{font-family:var(--f-mono);font-size:11px;color:var(--faint)}
.tape{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;min-height:14px}
.tk{display:block;width:14px;height:14px;border-radius:4px;animation:tkin .45s var(--ease) backwards;animation-delay:calc(var(--i) * 30ms)}
.tk.tp{background:var(--up);box-shadow:0 0 8px rgba(var(--up-rgb),.45)}
.tk.sl{background:var(--down);box-shadow:0 0 8px rgba(var(--down-rgb),.4)}
.tk.be{background:var(--be)}
.tk.na{border:1px dashed var(--faint)}
@keyframes tkin{from{opacity:0;transform:translateY(6px) scale(.3)}}
.tape-empty{font-size:12.5px;color:var(--faint);font-family:var(--f-mono)}
.ad{display:inline-block;width:7px;height:7px;border-radius:50%;flex:none}
.ad{background:var(--ac,var(--gold))}

/* Calendar head + stats */

.nav-arrows{display:flex;gap:6px}

.stats{position:relative;z-index:1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;margin-bottom:16px;background:rgba(var(--fg-rgb),.08);border:1px solid var(--line);border-radius:18px;overflow:hidden;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 20px 60px rgba(0,0,0,calc(.28 * var(--sh)))}

.stat:hover{background:rgba(var(--panel-hi-rgb),.92)}

.stat .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:clamp(22px,2.3vw,30px);font-weight:600;line-height:1.2;overflow-wrap:anywhere}

.streak i{width:10px;height:4px;border-radius:999px;background:var(--gold);box-shadow:0 0 6px rgba(var(--acc-rgb),.6)}
.stat .s{font-size:12px;color:var(--muted);font-family:var(--f-mono);overflow-wrap:anywhere}
.up{color:var(--up)} .down{color:var(--down)} .bec{color:var(--be)}

/* Calendar grid */
.cal-wrap{position:relative;z-index:1;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:10px;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 30px 90px rgba(0,0,0,calc(.35 * var(--sh)))}
.cal-wrap{background:rgba(var(--panel-rgb),.84);overflow:hidden}
.cal{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) repeat(2,minmax(0,.64fr)) minmax(0,1.1fr);gap:6px}
.cal.slide-next{animation:calnext .5s var(--ease)} .cal.slide-prev{animation:calprev .5s var(--ease)}
@keyframes calnext{from{opacity:0;transform:translateX(48px)}} @keyframes calprev{from{opacity:0;transform:translateX(-48px)}}
.month.swap{animation:mswap .45s var(--ease)} @keyframes mswap{from{opacity:0;transform:translateY(10px)}}
.wd{padding:6px 10px 4px;font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.day{appearance:none;font:inherit;color:inherit;display:flex;flex-direction:column;align-items:stretch;gap:3px;min-height:108px;padding:9px 10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;text-align:left;min-width:0;position:relative;transition:transform .2s var(--ease),border-color .2s,background .2s,box-shadow .2s}
.day:hover{transform:translateY(-3px);border-color:var(--gold-line);background:rgba(var(--fg-rgb),.06);box-shadow:0 14px 30px rgba(0,0,0,calc(.4 * var(--sh)))}
.day:focus-visible{outline:none;border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.day.pos{background:linear-gradient(180deg,var(--up-soft),rgba(var(--up-rgb),.03));border-color:var(--up-line)}
.day.neg{background:linear-gradient(180deg,var(--down-soft),rgba(var(--down-rgb),.03));border-color:var(--down-line)}
.day.flat{background:linear-gradient(180deg,var(--be-soft),rgba(var(--be-rgb),.03));border-color:var(--be-line)}
.day.out{background:transparent;border-style:dashed}
.day.is-empty:not(.today){border-color:transparent;background:rgba(var(--fg-rgb),.025)}
.day.is-empty:not(.today):hover{border-color:var(--gold-line);background:rgba(var(--fg-rgb),.05)}
.day.we:not(.today){background:rgba(var(--fg-rgb),.012)}
.day.we .d-num{color:var(--faint)}
.day.fut:not(.today) .d-num{color:var(--muted)}
.day.we .pill .sym{display:none}
.day:active{transform:scale(.97)}
.day.pos::before,.day.neg::before,.day.flat::before{content:"";position:absolute;left:12px;right:12px;top:-1px;height:2px;border-radius:0 0 3px 3px}
.day.pos::before{background:var(--up);box-shadow:0 0 12px var(--up)} .day.neg::before{background:var(--down);box-shadow:0 0 12px var(--down)} .day.flat::before{background:var(--be)}
.wd.we{color:var(--faint)}
.wd.now{color:var(--acc-text)}
.wd.now::after{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold);margin-left:6px;vertical-align:2px}
.day.out > *{opacity:.4}
.day.today{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold),0 0 26px rgba(var(--acc-rgb),.2)}
.day .row1{display:flex;justify-content:space-between;align-items:center;gap:4px}
.d-num{font-family:var(--f-mono);font-size:13px;font-weight:500;color:var(--ink-2);line-height:21px}
.day.today .d-num{background:var(--gold-grad);color:var(--on-gold);font-weight:600;border-radius:999px;padding:0 8px}
.marks{display:flex;gap:3px}
.mk{font-family:var(--f-mono);font-size:10px;font-weight:600;line-height:16px;min-width:17px;padding:0 3px;text-align:center;border-radius:4px;color:var(--gold);border:1px solid var(--gold-line);background:rgba(var(--bg-rgb),.5)}
.d-pnl{margin-top:auto;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600;font-size:15px;line-height:1.2;overflow-wrap:anywhere}

.d-meta{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:11.5px;color:var(--muted);font-family:var(--f-mono)}
.d-dots{display:none;gap:3px;flex-wrap:wrap}
.d-dots i{width:6px;height:6px;border-radius:50%}
.d-dots i.tp{background:var(--up)} .d-dots i.sl{background:var(--down)} .d-dots i.be{background:var(--be)} .d-dots i.na{background:var(--faint)} .d-dots i.ol{background:transparent;box-shadow:inset 0 0 0 1.5px var(--gold)}
.pills{margin-top:auto;display:flex;flex-wrap:wrap;gap:4px;min-width:0}

.pill .sym{overflow:hidden;text-overflow:ellipsis;font-weight:500}
.pill.tp{background:var(--up-soft);box-shadow:inset 0 0 0 1px var(--up-line)} .pill.tp b{color:var(--up)}
.pill.sl{background:var(--down-soft);box-shadow:inset 0 0 0 1px var(--down-line)} .pill.sl b{color:var(--down)}
.pill.be{background:var(--be-soft);box-shadow:inset 0 0 0 1px var(--be-line)} .pill.be b{color:var(--be)}
.pill.na b,.pill.more{color:var(--muted)}
@media (hover:hover){.day.is-empty:not(.out):hover::after{content:"+ Trade";margin-top:auto;font-family:var(--f-mono);font-size:12px;color:var(--gold)}}
.acc{font-family:var(--f-mono);font-size:10.5px;font-weight:600;padding:0 6px;border-radius:4px;line-height:17px;letter-spacing:.04em;white-space:nowrap;text-transform:uppercase;max-width:16em;overflow:hidden;text-overflow:ellipsis}

.wk{background:linear-gradient(180deg,var(--gold-soft),rgba(var(--acc-rgb),.04));border:1px solid rgba(var(--acc-rgb),.24);border-radius:12px;padding:9px 11px;display:flex;flex-direction:column;gap:3px;min-width:0}

.mini{display:flex;gap:1px;height:5px;border-radius:999px;overflow:hidden;background:rgba(var(--fg-rgb),.08);margin-top:5px}
.mini .r{display:block}
.weeks{display:none;position:relative;z-index:1;margin-top:12px;gap:6px}
.weeks .wrow{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;font-family:var(--f-mono);font-size:13px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}

.legend{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px;font-size:12.5px;color:var(--muted);align-items:center}

.hint{position:relative;z-index:1;margin:18px 0 0;padding:16px 18px;border:1.5px dashed var(--gold-line);border-radius:14px;color:var(--muted);max-width:920px;background:rgba(var(--bg-rgb),.55)}
.hint b{color:var(--acc-text)}

/* Pages */

.toolbar{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px;max-width:920px}
.search{flex:1 1 220px;max-width:340px;height:38px;padding:0 14px;border:1px solid var(--line-strong);border-radius:10px;background:rgba(var(--bg-rgb),.6);min-width:0}
.search:focus{outline:2px solid var(--gold);outline-offset:-1px;border-color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:32px;padding:0 14px;border-radius:999px;border:1px solid var(--line-strong);background:rgba(var(--bg-rgb),.55);font-size:13px;white-space:nowrap;transition:border-color .15s,background .15s}

.feed{position:relative;z-index:1;display:flex;flex-direction:column;gap:14px;max-width:920px}

.spot:hover::before{opacity:1}

.entry:hover{border-color:var(--gold-line);transform:translateY(-2px);box-shadow:0 24px 60px rgba(0,0,0,calc(.4 * var(--sh)))}
.e-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.e-title{font-family:var(--f-display);font-stretch:106%;font-weight:700;font-size:21px;line-height:1.25;margin:0;text-wrap:balance;overflow-wrap:anywhere}

.bias{font-family:var(--f-mono);font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:6px;white-space:nowrap;background:var(--surface-2);color:var(--ink-2);letter-spacing:.03em}
.bias.bull{background:var(--up-soft);color:var(--up)}
.bias.bear{background:var(--down-soft);color:var(--down)}

.res.hit{border-color:var(--up-line);color:var(--up)}
.res.miss{border-color:var(--down-line);color:var(--down)}
.ol{display:grid;grid-template-columns:140px minmax(0,1fr);gap:20px}

.empty{border:1.5px dashed var(--gold-line);border-radius:18px;padding:32px 22px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:12px;max-width:920px;background:rgba(var(--bg-rgb),.55)}

.feed.tl{gap:16px}

.tl-item{position:relative;display:grid;grid-template-columns:62px 36px minmax(0,1fr);align-items:start}

kbd{font-family:var(--f-mono);font-size:11px;min-width:20px;text-align:center;padding:1px 5px;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:5px;color:var(--ink-2);background:rgba(var(--fg-rgb),.04)}
@media (hover:none){.keys{display:none}}

/* Setup wizard & settings */
.gear{color:var(--muted)} .gear:hover{color:var(--ink)}
.setup{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:rgba(var(--bg-rgb),.55);-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);animation:fadein2 .4s}

@keyframes sustepb{from{opacity:0;transform:translateX(-28px)}}
.su-h{display:flex;flex-direction:column;gap:8px}

.big-inp{height:54px;font-size:18px;padding:0 16px}
.skin-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.skin-card{position:relative;display:flex;flex-direction:column;gap:9px;padding:8px 8px 10px;border-radius:16px;border:1.5px solid var(--line-strong);background:rgba(var(--fg-rgb),.03);text-align:left;min-width:0;transition:border-color .2s,box-shadow .25s,transform .25s var(--ease)}

.sk-bar{display:flex;align-items:center;gap:4px}
.sk-bar i{display:block;height:6px;width:16px;border-radius:999px;background:rgba(var(--fg-rgb),.16)}

.sk-chart{flex:1;display:flex;align-items:flex-end;gap:4px;padding:0 2px;min-height:0}

.mod-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.mod-card{display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:16px;border:1.5px solid var(--line-strong);background:rgba(var(--fg-rgb),.03);text-align:left;min-width:0;transition:border-color .2s,background .2s,box-shadow .25s}

.tgl{position:relative;width:40px;height:23px;border-radius:999px;background:rgba(var(--fg-rgb),.16);transition:background .25s;flex:none}
.tgl::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:var(--ink);transition:transform .35s cubic-bezier(.45,1.5,.45,1),background .25s}

.acct-ed{display:flex;flex-direction:column;gap:10px}

@keyframes acIn{from{opacity:0;transform:translateY(-6px)}}

.acct-color{--ac:var(--gold);width:42px;height:42px;flex:none;border-radius:10px;border:1px solid var(--line-strong);background:rgba(var(--fg-rgb),.04);display:grid;place-items:center;transition:border-color .15s,transform .15s}

#acct-filter::-webkit-scrollbar{display:none}
#acct-filter.more{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 44px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 44px),transparent)}

@media (max-width:640px){
  .su-card{padding:18px 16px 14px;border-radius:20px}

}

/* Shots */
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.thumb{position:relative;aspect-ratio:16/10;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:rgba(var(--fg-rgb),.04);max-width:100%;padding:0;display:block;width:100%;transition:border-color .15s,transform .2s var(--ease)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb img.broken{opacity:0}
.thumb:hover{border-color:var(--gold-line)}
button.thumb{cursor:zoom-in}
button.thumb:hover{transform:scale(1.02)}
.thumb .tv{all:unset;cursor:zoom-in;position:absolute;inset:0}
.thumb .tv:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
.thumb .rm{position:absolute;top:5px;right:5px;width:26px;height:26px;border-radius:7px;border:0;background:var(--scrim);color:var(--lb-fg);font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center}
.thumb .nb{position:absolute;left:5px;bottom:5px;font-family:var(--f-mono);font-size:10px;padding:1px 6px;border-radius:4px;background:var(--gold);color:var(--on-gold);font-weight:600}

/* Modal */
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.scrim{position:absolute;inset:0;background:var(--scrim);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);animation:fadein2 .2s}
@keyframes fadein2{from{opacity:0}}
.panel{position:relative;width:min(720px,100%);max-height:100%;overflow:auto;background:var(--modal);border:1px solid var(--gold-line);border-radius:20px;box-shadow:var(--shadow-lg);overscroll-behavior:contain;animation:pin .3s var(--ease)}
@keyframes pin{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
.p-head{position:sticky;top:0;z-index:2;background:var(--modal);display:flex;align-items:center;gap:12px;padding:16px 16px 14px 22px;border-bottom:1px solid var(--line)}
.p-head .ph-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}

.p-head .eyebrow{color:var(--gold)}
.p-body{padding:20px 22px;display:flex;flex-direction:column;gap:16px}
.p-foot{position:sticky;bottom:0;z-index:2;background:var(--modal);border-top:1px solid var(--line);padding:12px 22px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.day-sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.day-sum > div{background:var(--modal-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.day-sum .k{display:flex;align-items:center;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.day-sum .v{font-family:var(--f-mono);font-weight:600;font-size:15px;overflow-wrap:anywhere}
.tlist{display:flex;flex-direction:column;gap:10px}
.tcard{border:1px solid var(--line);background:rgba(var(--fg-rgb),.025);border-radius:14px;padding:13px 15px;display:flex;flex-direction:column;gap:10px;min-width:0;animation:pin .35s var(--ease) backwards}
.tcard:nth-child(2){animation-delay:.05s}.tcard:nth-child(3){animation-delay:.1s}.tcard:nth-child(n+4){animation-delay:.15s}
.tc-row{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;min-width:0}
.tc-sym{font-family:var(--f-mono);font-weight:600;font-size:15px;overflow-wrap:anywhere}
.side{font-family:var(--f-mono);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.side.long{color:var(--up)} .side.short{color:var(--down)}
.tc-time{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.tcard.tp{border-color:var(--up-line)} .tcard.sl{border-color:var(--down-line)} .tcard.be{border-color:var(--be-line)}
.oc-big{margin-left:auto;display:inline-flex;align-items:baseline;gap:7px;font-family:var(--f-mono);font-weight:700;font-size:15px;padding:4px 10px;border-radius:8px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.oc-big small{font-size:11px;font-weight:500;opacity:.85}
.oc-big.tp{background:var(--up-soft);color:var(--up)} .oc-big.sl{background:var(--down-soft);color:var(--down)} .oc-big.be{background:var(--be-soft);color:var(--ink)}
.tc-sub{font-size:13px;color:var(--muted)}
.tc-note{white-space:pre-wrap;overflow-wrap:anywhere;margin:0;font-size:14px;line-height:1.6;color:var(--ink-2)}
.tc-actions{display:flex;gap:6px;justify-content:flex-end}
.related{display:flex;flex-direction:column;gap:8px}
.sec{margin:0;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:500}
.rel{display:flex;align-items:center;gap:10px;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:rgba(var(--fg-rgb),.025);min-width:0}
.rel:hover{border-color:var(--gold-line)}
.rel .t{min-width:0;overflow-wrap:anywhere}

/* Form */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 14px}
.fld{display:flex;flex-direction:column;gap:7px;min-width:0}

.lbl{font-size:12px;font-weight:600;color:var(--ink-2);letter-spacing:.03em}
.lbl .opt{font-weight:400;color:var(--faint);margin-left:6px}
.inp{height:42px;padding:0 12px;border:1px solid var(--line-strong);border-radius:10px;background:rgba(var(--fg-rgb),.04);width:100%;min-width:0}

.ig{display:flex;height:42px;border:1px solid var(--line-strong);border-radius:10px;background:rgba(var(--fg-rgb),.04);overflow:hidden;min-width:0}
.ig:focus-within{outline:2px solid var(--gold);outline-offset:-1px;border-color:var(--gold)}

.ig input:focus{outline:none}
.ig .sign{border:0;border-right:1px solid var(--line);background:rgba(var(--fg-rgb),.04);width:42px;font-family:var(--f-mono);font-size:15px;color:var(--muted)}
.ig .sign:hover{color:var(--gold)}
.ig .sfx{display:flex;align-items:center;padding:0 12px;color:var(--gold);font-family:var(--f-mono);background:rgba(var(--fg-rgb),.04);border-left:1px solid var(--line)}
.acct-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,168px),1fr));gap:10px}
.acct-pick button{--ac:var(--gold);display:flex;align-items:center;gap:12px;padding:13px 15px;border:1.5px solid var(--line-strong);border-radius:12px;background:rgba(var(--fg-rgb),.03);text-align:left;min-width:0;transition:border-color .15s,background .15s,box-shadow .15s}
.acct-pick button > span:last-child{min-width:0}
.acct-pick button:hover{border-color:color-mix(in srgb,var(--ac) 55%,transparent)}
.acct-pick .dot{width:14px;height:14px;border-radius:4px;flex:none;background:var(--ac)}
.acct-pick [data-c="gold"] .dot{background:var(--gold-grad)}
.acct-pick b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct-pick small{display:block;color:var(--muted);font-size:12px;font-family:var(--f-mono)}
.acct-pick button[aria-checked="true"]{border-color:var(--ac);background:rgba(var(--fg-rgb),.06);background:color-mix(in srgb,var(--ac) 12%,transparent);box-shadow:0 0 22px color-mix(in srgb,var(--ac) 20%,transparent)}
.drop{border:1.5px dashed var(--gold-line);border-radius:12px;padding:18px 16px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;color:var(--muted);background:rgba(var(--acc-rgb),.04);cursor:pointer;font-size:13px;transition:border-color .15s,background .15s}
.drop svg{color:var(--gold)}
.drop:hover,.drop.over{border-color:var(--gold);color:var(--ink)}
.drop.over{background:var(--gold-soft)}
.drop b{color:var(--ink);font-weight:600;font-size:14px}
.drop kbd{font-family:var(--f-mono);font-size:12px;padding:0 5px;border:1px solid var(--line-strong);border-radius:4px;background:rgba(var(--fg-rgb),.06)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.form-err{margin:0;padding:10px 12px;border-radius:10px;background:var(--down-soft);border:1px solid var(--down-line);color:var(--down);font-size:14px}
.confirm{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}

/* Lightbox */
.lb{position:fixed;inset:0;z-index:80;background:var(--lb-bg);display:flex;align-items:center;justify-content:center;padding:max(56px,env(safe-area-inset-top,0px)) max(56px,env(safe-area-inset-right,0px)) max(56px,env(safe-area-inset-bottom,0px)) max(56px,env(safe-area-inset-left,0px));animation:fadein2 .2s}
.lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;box-shadow:0 0 0 1px var(--gold-line),0 30px 80px rgba(0,0,0,calc(.6 * var(--sh)))}
.lb-btn{position:absolute;width:44px;height:44px;border-radius:12px;border:1px solid var(--gold-line);background:rgba(255,255,255,.06);color:var(--lb-fg);font-size:22px;display:flex;align-items:center;justify-content:center}
.lb-btn:hover{background:var(--gold-soft)}
.lb-close{top:calc(8px + env(safe-area-inset-top,0px));right:calc(8px + env(safe-area-inset-right,0px))}
.lb-prev{left:calc(6px + env(safe-area-inset-left,0px));top:50%;transform:translateY(-50%)}
.lb-next{right:calc(6px + env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%)}
.lb-count{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:var(--gold);font-family:var(--f-mono);font-size:12px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:90;background:var(--gold-grad);color:var(--on-gold);font-weight:600;padding:11px 18px;border-radius:12px;font-size:14px;box-shadow:0 14px 40px rgba(0,0,0,calc(.5 * var(--sh)));max-width:calc(100% - 32px);animation:toastin .35s var(--ease)}
.toast.bad{background:var(--down);color:var(--on-gold)}
@keyframes toastin{from{opacity:0;transform:translate(-50%,14px)}}

/* Page loader: one candle from entry, dips toward SL, rallies into TP */
.loader{position:fixed;inset:0;z-index:28;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:radial-gradient(640px 440px at 50% 42%,rgba(var(--acc-rgb),.12),transparent 70%),radial-gradient(900px 600px at 50% 120%,rgba(var(--glow2-rgb),.25),transparent 65%),var(--bg);transform:translate3d(0,100%,0);will-change:transform;cursor:pointer}
.loader::before,.loader::after{content:"";position:absolute;left:0;right:0;height:2px;background:var(--gold-grad);box-shadow:0 0 22px rgba(var(--acc-rgb),.85),0 0 4px rgba(var(--acc-hi-rgb),.9)}
.loader::before{top:0} .loader::after{bottom:0}
.ld-inner{display:flex;flex-direction:column;align-items:center;gap:20px;will-change:transform,opacity}
.ld-svg{display:block;width:min(240px,62vw);height:auto;overflow:visible}
.ld-grid line{stroke:rgba(var(--fg-rgb),.05);stroke-width:1}
.ld-lvl line{stroke-width:1.5;stroke-dasharray:5 5;transform-box:fill-box;transform-origin:0 50%;transform:scaleX(0)}
.ld-tp line{stroke:var(--up)} .ld-sl line{stroke:var(--down)} .ld-en line{stroke:rgba(var(--fg-rgb),.32)}
.ld-tag{transform-box:fill-box;transform-origin:50% 50%;opacity:0}
.ld-tag rect{stroke-width:1}
.ld-tp rect{fill:var(--up-soft);stroke:var(--up-line)} .ld-sl rect{fill:var(--down-soft);stroke:var(--down-line)}
.ld-tag text{font-family:var(--f-mono);font-size:10.5px;font-weight:700;text-anchor:middle;letter-spacing:.04em}
.ld-tp text{fill:var(--up)} .ld-sl text{fill:var(--down)} .ld-en text{fill:var(--muted);text-anchor:start;font-weight:500}
.loader.run .ld-lvl line{animation:ldline .5s var(--ease) forwards}
.loader.run .ld-en line{animation-delay:.04s} .loader.run .ld-tp line{animation-delay:.1s} .loader.run .ld-sl line{animation-delay:.16s}
.loader.run .ld-tag{animation:ldfade .3s .26s ease-out forwards}
@keyframes ldline{to{transform:scaleX(1)}}
@keyframes ldfade{to{opacity:1}}
.ld-wick{stroke-width:3;stroke-linecap:round;stroke:rgba(var(--fg-rgb),.75)} .ld-wick.bull{stroke:var(--gold)}
.ld-body{stroke-width:1.5;fill:rgba(var(--fg-rgb),.16);stroke:rgba(var(--fg-rgb),.75)} .ld-body.bull{fill:url(#ldGold);stroke:var(--gold-hi);filter:url(#ldGlow)}
#ld-dot{fill:var(--ink)} #ld-dot.bull{fill:var(--gold-hi)}
.ld-pl{stroke-width:1;stroke-dasharray:3 4;opacity:.85;stroke:rgba(var(--fg-rgb),.7)} .ld-pl.bull{stroke:var(--gold)}
.ld-burst{fill:none;stroke:var(--gold-hi);stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:50% 50%}
.loader.hit .ld-burst.b1{animation:ldburst .7s ease-out forwards}
.loader.hit .ld-burst.b2{stroke:var(--up);animation:ldburst .9s .1s ease-out forwards}
@keyframes ldburst{0%{opacity:.95;transform:scale(.15)}100%{opacity:0;transform:scale(2.8)}}
.loader.hit .ld-tp line{stroke-dasharray:none;stroke-width:2.5;filter:drop-shadow(0 0 6px rgba(var(--up-rgb),.9))}
.loader.hit .ld-tp .ld-tag{animation:ldpop .5s var(--ease) forwards}
.loader.hit .ld-tp rect{fill:var(--up);stroke:var(--up)} .loader.hit .ld-tp text{fill:var(--on-gold)}
@keyframes ldpop{0%{opacity:1;transform:scale(1)}40%{opacity:1;transform:scale(1.4)}100%{opacity:1;transform:scale(1.12)}}
.ld-txt{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.ld-title{font-family:var(--f-display);font-stretch:118%;font-weight:800;text-transform:uppercase;font-size:clamp(30px,5vw,46px);line-height:1;letter-spacing:.02em;overflow:hidden;padding-block:.06em}
.ld-title .ch{display:inline-block;white-space:pre}
.loader.run .ld-title .ch{animation:ldch .55s var(--ease) backwards;animation-delay:calc(var(--i) * 30ms + 140ms)}
.ld-title .g{background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes ldch{from{opacity:0;transform:translateY(80%)}}
.ld-st{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);transition:color .2s}

/* Scroll reveal */
.rv-pop{animation:rvpop .8s var(--ease) backwards;animation-delay:var(--rd,0ms)}

.rv-wait{opacity:.1;transform:translateY(44px) scale(.96)}
.rv-go{transition:opacity .9s var(--ease),transform .9s var(--ease)!important;transition-delay:var(--gd,0ms)!important}

/* ---------- state ---------- */
const now0 = new Date();
const S = {
  view: 'kalender', mounted: null, mountN: 0,
  month: new Date(now0.getFullYear(), now0.getMonth(), 1),
  acct: lsGet('blotter.acct') || 'all',
  lastAccount: lsGet('blotter.lastAccount') || 'main',
  trades: [], learnings: [], outlooks: [],

const LS_DATA = 'blotter.v1.data', LS_IMG = 'blotter.v1.img.';
const OK_TYPES = ['image/png', 'image/jpeg', 'image/gif', 'image/webp'];

async function toJpeg(file, maxDim, q){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej({code: 'unsupported_type'}); i.src = url; });
    let w = img.naturalWidth, h = img.naturalHeight;
    const s = Math.min(1, maxDim / Math.max(w, h)); w = Math.round(w * s); h = Math.round(h * s);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const ctx = c.getContext('2d'); ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);

  if (c === 'unsupported_type') return 'Dieses Bildformat wird nicht unterstützt. Verwende PNG, JPG, GIF oder WebP.';

const Store = {
  db: null, assets: null, localOk: true,
  async init(){
    const c = window.claude;
    if (c && typeof c.use === 'function') {
      try {
        const [db, assets] = await Promise.all([c.use('db'), c.use('assets')]);
        if (db) { this.db = db; this.assets = assets; S.mode = 'cloud'; this.subscribe(); schedule(); return; }
      } catch (e) {}
    }
    this.initLocal();
  },
  subscribe(){
    const waiting = new Set(KINDS);
    const timer = setTimeout(() => {
      if (waiting.size) setBanner('Deine gespeicherten Einträge sind gerade nicht erreichbar. Die Seite lädt sie automatisch nach, sobald die Verbindung steht.');
    }, 10000);
    const done = k => { waiting.delete(k); if (!waiting.size) { clearTimeout(timer); setBanner(''); } };
    for (const k of KINDS) {
      this.db.collection(k).onSnapshot(snap => {
        S[k] = snap.docs.map(d => Object.assign({}, d.data(), {id: d.id}));
        S.loaded[k] = true;
        if (!snap.metadata.fromCache) done(k);
        schedule();
      }, err => {
        done(k); S.loaded[k] = true;
        if (err && err.code === 'revoked') { S.mode = 'error'; setBanner('Der Zugriff auf dieses Journal wurde entzogen.'); }

        schedule();

    }
    this.db.doc('settings/app').onSnapshot(snap => {
      if (snap.exists) S.settings = normSettings(snap.data());
      if (snap.exists || !snap.metadata.fromCache) S.settingsLoaded = true;
      applySettings(); Setup.maybe();
    }, () => { S.settingsLoaded = true; Setup.maybe(); });
  },

    S.mode = 'local';
    const raw = lsGet(LS_DATA);
    if (raw == null && !lsSet('blotter.v1.probe', '1')) this.localOk = false; else lsDel('blotter.v1.probe');
    if (raw) { try { const d = JSON.parse(raw); for (const k of KINDS) S[k] = Array.isArray(d[k]) ? d[k] : []; if (d.settings) S.settings = normSettings(d.settings); } catch (e) {} }
    for (const k of KINDS) S.loaded[k] = true;
    S.settingsLoaded = true; applySettings(); Setup.maybe();
    setBanner(this.localOk
      ? 'Cloud-Speicher ist in dieser Ansicht nicht verfügbar. Deine Einträge werden nur in diesem Browser gespeichert. Öffne das Journal über claude.ai, damit sie auf allen Geräten verfügbar sind.'
      : 'In dieser Ansicht kann nichts gespeichert werden. Öffne das Journal über claude.ai.');
    schedule();
  },
  persistLocal(){

  c: null, x: null, w: 0, h: 0, dpr: 1, gap: 17, headX: 0, cs: [], live: null, period: 1600, born: 0,
  min: null, max: null, scrollY: 0, t0: 0, last: 0, raf: 0, glow: 0, P: null,
  pal(){

  init(){

  resize(){

  },
  newLive(now){

  },

/* ---------- motion: reveal on scroll ---------- */
const Reveal = {
  on: !reduce && 'IntersectionObserver' in window,
  seen: new Map(), io: null,
  init(){
    if (!this.on) return;
    this.io = new IntersectionObserver(es => { for (const e of es) if (e.isIntersecting) this.show(e.target); }, {rootMargin: '0px 0px -6% 0px', threshold: 0.06});
  },
  scan(root){
    if (!this.on || !root) return;
    const vh = innerHeight, now = performance.now();
    root.querySelectorAll('[data-rv]').forEach(el => {
      const k = el.dataset.rv;
      const rd = parseFloat(el.style.getPropertyValue('--rd')) || 0;
      const st = this.seen.get(k);
      if (st === 'wait') { el.classList.add('rv-wait'); this.io.observe(el); return; }
      if (st) {
        const since = now - st;
        if (since < 950 + rd) { el.classList.add('rv-pop'); el.style.animationDelay = (rd - since) + 'ms'; }
        return;
      }
      const r = el.getBoundingClientRect();
      if (r.height && r.top > vh * 0.95) { this.seen.set(k, 'wait'); el.classList.add('rv-wait'); this.io.observe(el); }
      else { this.seen.set(k, now); el.classList.add('rv-pop'); }
    });
  },
  show(el){
    this.io.unobserve(el);
    const k = el.dataset.rv;
    const gd = parseFloat(el.style.getPropertyValue('--gd')) || 0;
    this.seen.set(k, performance.now() - (parseFloat(el.style.getPropertyValue('--rd')) || 0) + gd);
    el.classList.add('rv-go'); el.classList.remove('rv-wait');
    setTimeout(() => el.classList.remove('rv-go'), 1200 + gd);
  }
};

/* ---------- motion: count-up ---------- */
function setNum(el, v, fmt){
  if (!el) return;
  if (v == null || !isFinite(v)) { cancelAnimationFrame(el._raf); el._v = null; el.textContent = v === Infinity ? '∞' : '–'; return; }
  const prev = el._v;
  el._v = v;
  if (prev === v || reduce) { cancelAnimationFrame(el._raf); el.textContent = fmt(v); return; }
  const from = (prev == null || !isFinite(prev)) ? 0 : prev, t0 = performance.now(), dur = 1000;
  cancelAnimationFrame(el._raf);
  const step = now => { const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = fmt(from + (v - from) * e); if (k < 1) el._raf = requestAnimationFrame(step); };
  el._raf = requestAnimationFrame(step);
}

/* ---------- motion: page loader ---------- */
const LD_OPEN = 176, LD_TP = 64;
const LD_KF = [[0, 176], [0.1, 166], [0.22, 193], [0.38, 231], [0.47, 222], [0.58, 186], [0.72, 128], [0.86, 86], [1, 64]];
function ldPrice(u){
  let i = 1; while (i < LD_KF.length - 1 && u > LD_KF[i][0]) i++;
  const a = LD_KF[i - 1], b = LD_KF[i];
  const t = Math.max(0, Math.min(1, (u - a[0]) / (b[0] - a[0]))), s = t * t * (3 - 2 * t);
  const noise = (Math.sin(u * 61) * 4 + Math.sin(u * 23 + 1.3) * 3) * Math.pow(1 - u, 1.2) * Math.min(1, u * 8);
  return a[1] + (b[1] - a[1]) * s + noise;
}
const LD_NAMES = {kalender: ['Kal', 'ender'], learnings: ['Lear', 'nings'], outlooks: ['Out', 'looks']};
const easeOut = k => 1 - Math.pow(1 - k, 3);
const easeInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const Loader = {
  on: !reduce, active: false, swapped: false, hitDone: false, target: null, pending: null, raf: 0, t0: 0,
  T: {enter: 240, liveStart: 120, live: 640, swap: 900, exit: 430},
  init(){
    this.el = $('#loader'); this.inner = $('#ld-inner');
    this.body = $('#ld-body'); this.wick = $('#ld-wick'); this.pl = $('#ld-pl'); this.dot = $('#ld-dot');
    this.title = $('#ld-title'); this.st = $('#ld-st');
    this.tick = this.tick.bind(this);
    this.el.addEventListener('click', () => this.skipNow());
  },
  setLabel(view){
    const [a, b] = LD_NAMES[view] || [view, ''];
    let i = 0;
    const chars = (txt, g) => Array.from(txt).map(c => `<span class="ch${g ? ' g' : ''}" style="--i:${i++}">${esc(c)}</span>`).join('');
    this.title.innerHTML = chars(a, false) + chars(b, true);
  },
  draw(u){
    const y = ldPrice(u);
    let hi = Math.min(LD_OPEN, y), lo = Math.max(LD_OPEN, y);
    for (let s = 0; s < u; s += 0.01) { const p = ldPrice(s); if (p < hi) hi = p; if (p > lo) lo = p; }
    const bull = y < LD_OPEN - 0.5, ext = u > 0 ? 5 : 0;
    const top = Math.min(LD_OPEN, y), h = Math.max(2, Math.abs(y - LD_OPEN));
    this.body.setAttribute('y', top.toFixed(1)); this.body.setAttribute('height', h.toFixed(1));
    for (const el of [this.body, this.wick, this.pl, this.dot]) el.classList.toggle('bull', bull);
    this.wick.setAttribute('y1', (hi - ext).toFixed(1)); this.wick.setAttribute('y2', (lo + ext).toFixed(1));
    this.pl.setAttribute('y1', y.toFixed(1)); this.pl.setAttribute('y2', y.toFixed(1));
    this.dot.setAttribute('cy', y.toFixed(1));
  },
  play(view){
    this.active = true; this.swapped = false; this.hitDone = false; this.pending = null; this.target = view;
    this.setLabel(view);
    this.st.textContent = 'Entry · warte auf TP';
    const el = this.el;

    el.style.transform = 'translate3d(0,100%,0)';
    this.inner.style.opacity = ''; this.inner.style.transform = '';

    const u = Math.max(0, Math.min(1, (e - T.liveStart) / T.live));

/* ---------- stats ---------- */
const RES_LABEL = {tp: 'TP', sl: 'SL', be: 'BE'};
const RES_NAME = {tp: 'Take Profit', sl: 'Stop Loss', be: 'Break Even'};
function resOf(t){
  if (t.result === 'tp' || t.result === 'sl' || t.result === 'be') return t.result;
  const p = num(t.pnl);
  if (p != null) return p > 0 ? 'tp' : p < 0 ? 'sl' : 'be';
  return null;
}
const chrono = list => list.slice().sort((a, b) => (a.date || '').localeCompare(b.date || '') || (a.time || '99').localeCompare(b.time || '99') || (a.createdAt || 0) - (b.createdAt || 0));
function calc(list){
  let tp = 0, sl = 0, be = 0, run = 0, best = 0;
  const per = {};
  const days = new Set();
  for (const t of chrono(list)) {
    const r = resOf(t);
    if (r === 'tp') { tp++; run++; if (run > best) best = run; }
    else if (r === 'sl') { sl++; run = 0; }
    else if (r === 'be') be++;
    const ak = acctOf(t); per[ak] = (per[ak] || 0) + 1;
    if (t.date) days.add(t.date);
  }
  return {n: list.length, tp, sl, be, per, tdays: days.size, best, run, wr: (tp + sl) ? tp / (tp + sl) : null};
}
function tone(c){ if (!c.n) return ''; if (c.tp > c.sl) return 'pos'; if (c.sl > c.tp) return 'neg'; return (c.tp || c.sl || c.be) ? 'flat' : ''; }
const pct = (a, n) => n ? Math.round(a / n * 100) + ' %' : '–';
const curAcct = () => S.acct !== 'all' && acctById(S.acct) ? S.acct : 'all';
const byAcct = list => { const f = curAcct(); return f === 'all' ? list : list.filter(t => acctOf(t) === f); };
const acctCounts = per => accts().filter(a => per[a.id]).map(a => ({a, n: per[a.id]}));
const sortTrades = list => list.slice().sort((a, b) => (a.time || '99').localeCompare(b.time || '99') || (a.createdAt || 0) - (b.createdAt || 0));
const sortEntries = list => list.slice().sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.createdAt || 0) - (a.createdAt || 0));

const fMonS = new Intl.DateTimeFormat(LOC, {month: 'short'}), fWdS = new Intl.DateTimeFormat(LOC, {weekday: 'short'});
function tlItem(date, rv, i, inner){
  let b = '–', mo = '', wd = '';
  if (date) { const d = parseYmd(date); b = pad(d.getDate()); mo = fMonS.format(d).replace('.', '') + ' \u2019' + String(d.getFullYear()).slice(2); wd = fWdS.format(d).replace('.', ''); }
  return `<div class="tl-item" data-rv="${rv}" style="--rd:${200 + Math.min(i, 5) * 80}ms"><div class="tl-date"><b>${b}</b><span>${esc(mo)}</span><small>${esc(wd)}</small></div><span class="tl-node" aria-hidden="true"></span>${inner}</div>`;
}
function shotsHtml(refs){
  if (!refs || !refs.length) return '';
  return '<div class="shots">' + refs.map((r, i) =>
    `<button type="button" class="thumb" data-lb="${i}" aria-label="Screenshot ${i + 1} vergrößern"><img loading="lazy" src="${esc(Store.imgSrc(r))}" alt=""></button>`).join('') + '</div>';
}

/* trade tape for the hero */
function tapeHtml(list){
  return chrono(list).map((t, i) => {
    const r = resOf(t) || 'na';
    const tip = (t.date ? fDM.format(parseYmd(t.date)) : '') + ' · ' + (t.symbol || 'Trade') + ' · ' + (RES_LABEL[r] || 'ohne Ergebnis') + ' · ' + an(t.account);
    return `<i class="tk ${r}" style="--i:${Math.min(i, 40)}" title="${esc(tip)}"></i>`;
  }).join('');
}
const ratioW = (v, tot) => (tot ? (v / tot * 100).toFixed(2) : 0) + '%';
const countsHtml = c => `<span class="cnts"><span class="cnt"><i class="sw tp"></i>${c.tp} TP</span><span class="cnt"><i class="sw be"></i>${c.be} BE</span><span class="cnt"><i class="sw sl"></i>${c.sl} SL</span></span>`;

            ${[['all','Alle'],['bull','▲ Bullish'],['bear','▼ Bearish'],['neutral','● Neutral']].map(([v, l]) => `<button type="button" class="chip" data-obias="${v}">${l}</button>`).join('')}
          </div>
        </div>
        <div class="feed" id="o-feed"></div>
      </section>`;
    },
    update(){
      const M = S.mountN;
      const all = S.outlooks;
      $$('#o-bias .chip').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.obias === S.obias)));
      const hit = all.filter(o => o.result === 'hit').length, miss = all.filter(o => o.result === 'miss').length;
      $('#o-sub').textContent = all.length
        ? all.length + (all.length === 1 ? ' Outlook' : ' Outlooks') + (hit + miss ? ' · Trefferquote ' + Math.round(hit / (hit + miss) * 100) + ' % (' + hit + ' von ' + (hit + miss) + ' bewertet)' : ' · noch keiner bewertet') + '. Wer vorbereitet ist, handelt nach Plan.'
        : 'Wer vorbereitet ist, reagiert nicht, er handelt nach Plan.';
      const q = S.oq.trim().toLowerCase();
      const list = sortEntries(all.filter(o => (S.obias === 'all' || (o.bias || 'neutral') === S.obias) && (!q || [o.symbol, o.title, o.text].join(' ').toLowerCase().includes(q))));
      const feed = $('#o-feed');
      feed.classList.remove('tl');
      if (!S.loaded.outlooks) { feed.innerHTML = '<div class="empty sm"><p>Outlooks werden geladen…</p></div>'; return; }
      if (!all.length) { feed.innerHTML = `<div class="empty" data-rv="${M}:empty" style="--rd:200ms"><h3>Noch keine Outlooks</h3><p>Schreib vor der Session auf, was du vom Markt erwartest, und häng deinen markierten Chart an. Nach dem Tag markierst du, ob es eingetreten ist.</p><button type="button" class="btn primary" data-action="new-outlook">${ICON.plus}Ersten Outlook eintragen</button></div>`; return; }
      if (!list.length) { feed.innerHTML = '<div class="empty sm"><p>Keine Outlooks passen zu deinem Filter.</p></div>'; return; }
      feed.classList.add('tl');
      feed.innerHTML = '<div class="tl-rail" aria-hidden="true"><i class="tl-fill"></i></div>' + list.map((o, i) => {
        const b = o.bias || 'neutral';
        const bl = b === 'bull' ? '▲ Bullish' : b === 'bear' ? '▼ Bearish' : '● Neutral';
        const tf = {intraday: 'Intraday', daily: 'Daily', weekly: 'Weekly', monthly: 'Monthly'}[o.tf] || '';
        const res = o.result === 'hit' ? '<span class="res hit">Eingetreten</span>' : o.result === 'miss' ? '<span class="res miss">Nicht eingetreten</span>' : '<span class="res">Offen</span>';
        return tlItem(o.date, `${M}:o:${esc(o.id)}`, i, `
        <article class="entry ol spot">
          <div class="ol-side"><span class="ol-sym">${esc(o.symbol || '—')}</span><span class="bias ${b === 'bull' ? 'bull' : b === 'bear' ? 'bear' : ''}">${bl}</span>${tf ? `<span class="ol-tf">${tf}</span>` : ''}</div>
          <div class="ol-main">
            <div class="e-meta"><span>Outlook</span>${res}<span class="spacer"></span>
              <button type="button" class="btn sm ghost" data-action="edit-outlook" data-id="${esc(o.id)}">Bearbeiten</button></div>
            ${o.title ? `<h3 class="e-title">${esc(o.title)}</h3>` : ''}
            ${o.text ? `<p class="e-text">${esc(o.text)}</p>` : ''}
            ${shotsHtml(o.shots)}
          </div>
        </article>`);
      }).join('');
    }
  }
};

/* ---------- modal ---------- */
const Modal = {
  cur: null, opener: null,
  show(builder, opts){
    opts = opts || {};
    if (this.cur && this.cur.cleanup) this.cur.cleanup();
    if (!this.cur) this.opener = document.activeElement;
    this.cur = {builder, live: !!opts.live, back: opts.back || null, cleanup: opts.cleanup || null, dirty: false};
    const panel = $('#panel');
    panel.innerHTML = builder();
    panel.scrollTop = 0;
    $('#modal').hidden = false;
    panel.style.animation = 'none'; void panel.offsetWidth; panel.style.animation = '';
    document.documentElement.style.overflow = 'hidden';
    if (opts.onMount) opts.onMount(panel);
    const f = panel.querySelector(opts.focus || '.p-body button, .p-body input, .p-body textarea, .p-foot button');
    if (f) { try { f.focus({preventScroll: true}); } catch (e) { f.focus(); } }
  },
  refresh(){
    if (!this.cur || !this.cur.live) return;
    const panel = $('#panel'), sc = panel.scrollTop;
    panel.innerHTML = this.cur.builder(); panel.scrollTop = sc;
    $$('.tcard', panel).forEach(c => { c.style.animation = 'none'; });
  },
  close(){
    if (!this.cur) return;
    if (this.cur.cleanup) this.cur.cleanup();
    this.cur = null;
    $('#modal').hidden = true; $('#panel').innerHTML = '';
    document.documentElement.style.overflow = '';
    if (this.opener && document.contains(this.opener)) { try { this.opener.focus({preventScroll: true}); } catch (e) {} }
    this.opener = null;
  },
  back(){
    if (this.cur && this.cur.back) { const b = this.cur.back; if (this.cur.cleanup) this.cur.cleanup(); this.cur.cleanup = null; b(); }
    else this.close();
  },
  tryClose(){
    if (this.cur && this.cur.dirty) {
      const err = $('#form-err');
      if (err) { err.textContent = 'Du hast ungespeicherte Änderungen. Speichere sie oder klicke auf „Abbrechen“, um sie zu verwerfen.'; err.hidden = false; err.scrollIntoView({block: 'nearest'}); }
      return;
    }
    this.close();
  }
};

function datalists(){
  const uniq = arr => Array.from(new Set(arr.map(x => (x || '').trim()).filter(Boolean))).sort((a, b) => a.localeCompare(b, LOC));
  const opt = a => a.map(x => `<option value="${esc(x)}"></option>`).join('');
  return `<datalist id="dl-symbols">${opt(uniq(S.trades.map(t => t.symbol).concat(S.outlooks.map(o => o.symbol))))}</datalist>
    <datalist id="dl-setups">${opt(uniq(S.trades.map(t => t.setup)))}</datalist>
    <datalist id="dl-cats">${opt(uniq(['Psychologie', 'Risikomanagement', 'Entry', 'Exit', 'Setup', 'Disziplin', 'Marktstruktur'].concat(S.learnings.map(l => l.category))))}</datalist>`;
}

function fieldHtml(f, v){
  const full = f.full ? ' full' : '';
  const opt = f.opt ? '<span class="opt">optional</span>' : '';
  const val = v[f.k];
  const id = 'f-' + f.k;
  switch (f.t) {
    case 'acct':
      return `<div class="fld full"><span class="lbl" id="${id}-l">${f.label}</span>
        <div class="acct-pick" role="radiogroup" aria-labelledby="${id}-l" data-field="${f.k}">
          ${(() => { const cur = acctOf({account: val}); return accts().map((a, i) =>
            `<button type="button" role="radio" data-val="${esc(a.id)}" data-c="${a.color}" style="--ac:${acVar(a.id)}" aria-checked="${a.id === cur}"><span class="dot"></span><span><b>${esc(a.name)}</b><small>Konto ${i + 1}</small></span></button>`).join(''); })()}
        </div></div>`;
    case 'seg':
      return `<div class="fld${full}"><span class="lbl" id="${id}-l">${f.label}${opt}</span>
        <div class="seg wide ${f.cls || ''}" role="radiogroup" aria-labelledby="${id}-l" data-field="${f.k}">
          ${f.opts.map(([k, l]) => `<button type="button" role="radio" data-val="${k}" aria-checked="${val === k}">${l}</button>`).join('')}
        </div></div>`;
    case 'date': case 'time':
      return `<label class="fld${full}" for="${id}"><span class="lbl">${f.label}${opt}</span><input class="inp" type="${f.t}" id="${id}" value="${esc(val || '')}"></label>`;
    case 'text':
      return `<label class="fld${full}" for="${id}"><span class="lbl">${f.label}${opt}</span><input class="inp" type="text" id="${id}" value="${esc(val || '')}" placeholder="${esc(f.ph || '')}"${f.list ? ` list="${f.list}"` : ''} autocomplete="off"${f.caps ? ' autocapitalize="characters"' : ''}></label>`;
    case 'dec': {
      const shown = val == null || Number.isNaN(val) ? '' : String(val).replace('.', ',');
      return `<div class="fld${full}"><label class="lbl" for="${id}">${f.label}${opt}</label>
        <div class="ig"><button type="button" class="sign" data-action="flip-sign" data-target="${id}" aria-label="Vorzeichen umkehren" title="Vorzeichen umkehren">±</button>
        <input type="text" inputmode="decimal" id="${id}" value="${esc(shown)}" placeholder="${esc(f.ph || '')}" autocomplete="off">
        ${f.unit ? `<span class="sfx">${esc(f.unit)}</span>` : ''}</div></div>`;
    }
    case 'area':
      return `<label class="fld full" for="${id}"><span class="lbl">${f.label}${opt}</span><textarea class="inp" id="${id}" rows="${f.rows || 5}" placeholder="${esc(f.ph || '')}">${esc(val || '')}</textarea></label>`;
    case 'shots': {
      const can = Store.canUpload();
      return `<div class="fld full"><span class="lbl">${f.label}<span class="opt">optional</span></span>
        ${can ? `<label class="drop" for="f-file" id="drop">${ICON.img}<b>Screenshot hinzufügen</b><span>Klicken, Bild hierher ziehen oder mit <kbd>${isMac ? '⌘' : 'Strg'}+V</kbd> einfügen</span></label>
        <input type="file" id="f-file" accept="image/*" multiple hidden>` : `<p class="lbl">Screenshots können in dieser Ansicht nicht hinzugefügt werden.</p>`}
        <div class="thumbs" id="thumbs" hidden></div></div>`;
    }
  }
  return '';
}

function openForm(kind, entry, opts){
  opts = opts || {};
  const def = FORMS[kind];
  const isNew = !entry;
  const v = Object.assign({}, def.defaults(opts), entry || {});
  if (kind === 'trades' && entry && !entry.result) v.result = resOf(entry) || '';
  const st = {shots: (v.shots || []).map(ref => ({ref})), removed: [], busy: false};
  const back = opts.fromDay ? () => openDay(opts.fromDay) : null;

  const builder = () => `
    <div class="p-head"><div class="ph-t"><span class="eyebrow">${kind === 'trades' ? 'Trade' : kind === 'learnings' ? 'Learning' : 'Outlook'}</span><h2 id="modal-title">${isNew ? def.newTitle : def.editTitle}</h2></div>
      <button type="button" class="btn icon ghost" data-action="close-modal" aria-label="Schließen">${ICON.x}</button></div>
    <form class="p-body" id="entry-form" novalidate>
      <div class="form">${def.fields.map(f => fieldHtml(f, v)).join('')}</div>
      ${datalists()}
      <p class="form-err" id="form-err" role="alert" hidden></p>
    </form>
    <div class="p-foot">
      ${isNew ? '' : '<div class="confirm" id="del-zone"><button type="button" class="btn ghost danger" data-action="ask-del">Löschen</button></div>'}
      <span class="spacer"></span>
      <button type="button" class="btn" data-action="form-cancel">Abbrechen</button>
      <button type="submit" form="entry-form" class="btn primary" id="save-btn">${isNew ? 'Speichern' : 'Änderungen speichern'}</button>
    </div>`;

  let panel, urls = [];
  const markDirty = () => { if (Modal.cur) Modal.cur.dirty = true; const e = $('#form-err'); if (e && !st.busy) e.hidden = true; };
  const showErr = msg => { const e = $('#form-err'); e.textContent = msg; e.hidden = false; e.scrollIntoView({block: 'nearest'}); };

  const renderThumbs = () => {
    const el = panel.querySelector('#thumbs'); if (!el) return;
    el.innerHTML = st.shots.map((s, i) => `<div class="thumb"><img src="${esc(s.ref ? Store.imgSrc(s.ref) : s.url)}" alt=""><button type="button" class="tv" data-lb="${i}" aria-label="Screenshot ${i + 1} ansehen"></button>${s.ref ? '' : '<span class="nb">neu</span>'}<button type="button" class="rm" data-rm="${i}" aria-label="Screenshot ${i + 1} entfernen">×</button></div>`).join('');
    el.hidden = !st.shots.length;
  };
  const addFiles = files => {
    const imgs = Array.from(files || []).filter(f => f && (f.type || '').startsWith('image/'));
    if (!imgs.length) { toast('Nur Bilddateien können als Screenshot angehängt werden.', true); return; }
    for (const f of imgs) { if (f.size > 40 * 1024 * 1024) { toast('Ein Bild ist größer als 40 MB und wurde übersprungen.', true); continue; } const url = URL.createObjectURL(f); urls.push(url); st.shots.push({file: f, url}); }
    markDirty(); renderThumbs();
  };
  const onPaste = e => {
    if (!Store.canUpload()) return;
    const items = Array.from((e.clipboardData && e.clipboardData.items) || []).filter(i => i.kind === 'file' && i.type.startsWith('image/'));
    if (!items.length) return;
    e.preventDefault();
    addFiles(items.map(i => i.getAsFile()).filter(Boolean));
    toast(items.length === 1 ? 'Screenshot eingefügt' : items.length + ' Screenshots eingefügt');
  };

  const collect = () => {
    const out = {};
    for (const f of def.fields) {
      if (f.t === 'shots') continue;
      if (f.t === 'seg' || f.t === 'acct') { const b = panel.querySelector(`[data-field="${f.k}"] [aria-checked="true"]`); out[f.k] = b ? b.dataset.val : ''; continue; }
      const el = panel.querySelector('#f-' + f.k); const raw = el ? el.value : '';
      out[f.k] = f.t === 'dec' ? parseDec(raw) : raw.trim();
    }
    if (out.symbol) out.symbol = out.symbol.toUpperCase();
    return out;
  };

  const submit = async e => {
    e.preventDefault();
    if (st.busy) return;
    const vals = collect();
    const msg = def.validate(vals);
    if (msg) { showErr(msg); return; }
    st.busy = true;
    const btn = panel.querySelector('#save-btn'), label = btn.textContent;
    $$('.p-foot button', panel).forEach(b => b.disabled = true);
    try {
      const pending = st.shots.filter(s => !s.ref);
      let i = 0;
      for (const s of pending) { i++; btn.textContent = pending.length > 1 ? `Screenshot ${i}/${pending.length} wird hochgeladen…` : 'Screenshot wird hochgeladen…'; s.ref = await Store.uploadImage(s.file); }
      btn.textContent = 'Wird gespeichert…';
      const ts = Date.now();
      const obj = Object.assign({}, entry || {}, vals, {
        id: (entry && entry.id) || newId(),
        shots: st.shots.map(s => s.ref),
        createdAt: (entry && entry.createdAt) || ts, updatedAt: ts
      });
      if (kind === 'trades') { delete obj.pnl; delete obj.r; }
      await Store.save(kind, obj);
      for (const ref of st.removed) Store.deleteImage(ref);
      if (kind === 'trades' && obj.account) { S.lastAccount = obj.account; lsSet('blotter.lastAccount', obj.account); }
      st.busy = false;
      toast(def.saved);
      if (Modal.cur) Modal.cur.dirty = false;
      if (kind === 'trades' && !opts.fromDay && obj.date) {
        const d = parseYmd(obj.date); S.month = new Date(d.getFullYear(), d.getMonth(), 1);
        if (S.view !== 'kalender') location.hash = 'kalender';
        schedule();
      }
      Modal.back();
    } catch (err) {
      st.busy = false;
      $$('.p-foot button', panel).forEach(b => b.disabled = false);
      btn.textContent = label;
      renderThumbs();
      showErr(errText(err));
    }
  };

  const doDelete = async () => {
    if (!entry || st.busy) return;
    st.busy = true;
    $$('.p-foot button', panel).forEach(b => b.disabled = true);
    try {
      await Store.remove(kind, entry.id);
      for (const ref of (entry.shots || [])) Store.deleteImage(ref);
      st.busy = false;
      if (Modal.cur) Modal.cur.dirty = false;
      toast(def.deleted);
      Modal.back();
    } catch (err) {
      st.busy = false;
      $$('.p-foot button', panel).forEach(b => b.disabled = false);
      showErr(errText(err));
    }
  };

  Modal.show(builder, {
    back,
    focus: kind === 'learnings' ? '#f-title' : '#f-symbol',
    onMount(p){
      panel = p;
      p.querySelector('#entry-form').addEventListener('submit', submit);
      p.addEventListener('input', markDirty);
      p.addEventListener('click', e => {
        const sb = e.target.closest('[data-field] [data-val]');
        if (sb) { $$('[data-val]', sb.parentElement).forEach(b => b.setAttribute('aria-checked', String(b === sb))); markDirty(); return; }
        const rm = e.target.closest('[data-rm]');
        if (rm) { const i = +rm.dataset.rm; const s = st.shots[i]; if (s) { if (s.ref) st.removed.push(s.ref); st.shots.splice(i, 1); markDirty(); renderThumbs(); } return; }
        const fs = e.target.closest('[data-action="flip-sign"]');
        if (fs) { const inp = p.querySelector('#' + fs.dataset.target); const val = inp.value.trim(); inp.value = val.startsWith('-') || val.startsWith('−') ? val.slice(1) : '-' + val; markDirty(); inp.focus(); return; }
        const ad = e.target.closest('[data-action="ask-del"]');
        if (ad) { $('#del-zone', p).innerHTML = `<span>${esc(def.what.charAt(0).toUpperCase() + def.what.slice(1))} löschen?</span><button type="button" class="btn sm danger-solid" data-action="confirm-del">Ja, löschen</button><button type="button" class="btn sm" data-action="cancel-del">Nein</button>`; return; }
        if (e.target.closest('[data-action="cancel-del"]')) { $('#del-zone', p).innerHTML = '<button type="button" class="btn ghost danger" data-action="ask-del">Löschen</button>'; return; }
        if (e.target.closest('[data-action="confirm-del"]')) { doDelete(); return; }
        if (e.target.closest('[data-action="form-cancel"]')) { if (Modal.cur) Modal.cur.dirty = false; Modal.back(); }
      });
      const fi = p.querySelector('#f-file');
      if (fi) fi.addEventListener('change', () => { addFiles(fi.files); fi.value = ''; });
      const drop = p.querySelector('#drop');
      if (drop) {
        ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
        ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
        drop.addEventListener('drop', e => addFiles(e.dataTransfer && e.dataTransfer.files));
      }
      document.addEventListener('paste', onPaste);
      renderThumbs();
    },
    cleanup(){ document.removeEventListener('paste', onPaste); urls.forEach(u => URL.revokeObjectURL(u)); urls = []; }
  });
}

const SKIN_IDS = SKINS.map(k => k.id);
function normSettings(d){
  d = d || {};
  const o = {theme: 'navy', name: '', modules: {learnings: true, outlooks: true}, accounts: [], setupDone: !!d.setupDone};
  if (SKIN_IDS.includes(d.theme)) o.theme = d.theme;
  if (typeof d.name === 'string') o.name = d.name.trim().slice(0, 30);
  if (d.modules && typeof d.modules === 'object') { o.modules.learnings = d.modules.learnings !== false; o.modules.outlooks = d.modules.outlooks !== false; }
  o.accounts = normAccounts(d);
  return o;
}
/* Accounts: 1 to 10, each {id, name, color}. Trades point to an id. Older journals stored two fixed
   names (acctNames.main / .neben); those become the first two accounts with the same ids. */
const MAX_ACCTS = 10;
const AC_KEYS = ['gold', 'silver', 'violet', 'coral', 'mint', 'rose', 'sky', 'lemon', 'blue', 'sand'];
const ACCT_PH = ['z. B. FTMO 100k', 'z. B. Privatkonto', 'z. B. Apex 50k', 'z. B. Topstep', 'z. B. Demokonto'];
const acctDefault = (id, i) => id === 'main' ? 'Main-Konto' : id === 'neben' ? 'Neben-Konto' : 'Konto ' + (i + 1);
function normAccounts(d){
  let src = Array.isArray(d.accounts) ? d.accounts : null;
  if (!src) { const n = d.acctNames && typeof d.acctNames === 'object' ? d.acctNames : {}; src = [{id: 'main', name: n.main, color: 'gold'}, {id: 'neben', name: n.neben, color: 'silver'}]; }
  const out = [], seen = new Set();
  for (const a of src) {
    if (!a || typeof a !== 'object') continue;
    const id = String(a.id || '');
    if (!/^[A-Za-z0-9_-]{1,40}$/.test(id) || seen.has(id)) continue;
    seen.add(id);
    out.push({id, name: String(a.name || '').trim().slice(0, 24) || acctDefault(id, out.length), color: AC_KEYS.includes(a.color) ? a.color : ''});
    if (out.length >= MAX_ACCTS) break;
  }
  if (!out.length) out.push({id: 'main', name: 'Main-Konto', color: 'gold'});
  for (const a of out) if (!a.color) a.color = freeColor(out);
  return out;
}
function freeColor(list, after){
  const used = new Set(list.map(a => a.color)), start = after ? AC_KEYS.indexOf(after) + 1 : 0;
  for (let i = 0; i < AC_KEYS.length; i++) { const k = AC_KEYS[(start + i) % AC_KEYS.length]; if (!used.has(k)) return k; }
  return AC_KEYS[start % AC_KEYS.length];
}
const newAcctId = () => 'k' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
function accts(){ const l = S.settings.accounts; return l && l.length ? l : [{id: 'main', name: 'Main-Konto', color: 'gold'}]; }
function acctById(id){ return id ? accts().find(a => a.id === id) : undefined; }
function acctOf(t){ const a = t && acctById(t.account); return a ? a.id : accts()[0].id; }
function acVar(id){ return 'var(--ac-' + (acctById(id) || accts()[0]).color + ')'; }
const adot = id => `<i class="ad" style="--ac:${acVar(id)}"></i>`;
const settingsSig = () => JSON.stringify([S.settings.name, S.settings.modules, S.settings.accounts]);
function modOn(k){ return k === 'kalender' || !(S.settings.modules && S.settings.modules[k] === false); }
function pagesOn(){ return ['kalender', 'learnings', 'outlooks'].filter(modOn); }
function an(id){ return (acctById(id) || accts()[0]).name; }
function applySkin(id, persist){
  if (!SKIN_IDS.includes(id)) id = 'navy';

}

function acctEditor(list, p, fresh){
  return `<div class="acct-ed" data-acct-ed="${p}">
